<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nie ma takiej strony | Jan Borsa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#173b63">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-192.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:#111827;background:linear-gradient(135deg,#f7f8fa 0%,#eef2f6 100%);-webkit-font-smoothing:antialiased}
main{max-width:560px;text-align:center}
.code{font-size:clamp(84px,22vw,150px);font-weight:800;letter-spacing:-.06em;line-height:1;color:#173b63;margin:0}
h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.03em;margin:14px 0 12px}
p{color:#475467;font-size:18px;line-height:1.55;margin:0 0 28px}
a.btn{display:inline-block;padding:15px 26px;border-radius:10px;background:#173b63;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
a.btn:hover{background:#12304f}
a.btn:focus-visible{outline:3px solid #6f9bd1;outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<h1>Nie ma takiej strony.</h1>
<p>Adres mógł się zmienić albo został wpisany z błędem. Wróć na stronę główną i znajdź to, czego szukasz.</p>
<a class="btn" id="home" href="/">Wróć na stronę główną</a>
</main>
<script>
// Link do strony glownej: na domenie "/", na GitHub Pages (adres projektu) pierwszy segment sciezki.
(function () {
  var h = location.hostname, a = document.getElementById('home');
  if (/\.github\.io$/.test(h)) {
    var seg = location.pathname.split('/')[1];
    a.href = '/' + (seg ? seg + '/' : '');
  }
})();
</script>
</body>
</html>
